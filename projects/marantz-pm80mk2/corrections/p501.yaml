annotations:
  - {page: 4, at: [8193, 3317], voltage: 6.0, delete: true, status: proposed,
     why: 'Printed "6.0V" at the Q502 base, a misprint: the same net is printed 0.6V at the QM25 collector, and the left twin (Q501 base) is printed 0.6V. 6.0 V there is impossible with the output at -0.02 V.'}
  - {page: 4, at: [8517, 3617], voltage: -0.04, net_pin: Q504.E, status: proposed,
     why: '"-0.04V" right of R522 marks the R522 / Q504 emitter node (twin of the left -0.04V at Q503.E); nearest-wire put it on a wire stub with no part. OCR read it "F0.04V" (wire touching the minus).'}
  - {page: 4, at: [8611, 3207], voltage: -0.02, net_pin: Q502.E, status: proposed,
     why: 'The "-0.02V" arrow ends at R520 by the Q502 emitter, as its left twin does at R519 / Q501.E; the label was put on the C510 + side (coupled output).'}
