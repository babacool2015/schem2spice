  - {page: 4, at: [1883, 1330], type: inductor, ref: L401, value: 320u, status: confirmed,
     why: 'Input RF choke; no value on the schematic. Confirmed by the user (2026-11-16): a board photo shows a small radial drum-core choke (~6-8 mm), far too small for 320 mH.',
     over_list: 'Parts list "Choke Coil, 320mH [/22B/22G]". 320 mH in series with the phono input is 2 kohm at 1 kHz and resonates with C401 near 15 kHz: the chain (systems/chain.yaml) then gives RIAA +5.1 dB at 12.6 kHz, MC gain 76.1 dB and MC input 2.0 kohm. With 320 uH: RIAA within 0.13 dB, MC 102.17 dB (spec 220 uV -> 102.17 dB), MC input 100 ohm, as the specs on PDF 3 state.'}
  - {page: 4, at: [1897, 1657], type: inductor, ref: L402, value: 320u, status: confirmed,
