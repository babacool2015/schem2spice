name: tests

on:
  push:
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      # The service manual is not in the repo, so tests that read its scan skip;
      # the engine tests and the golden PM11 netlist/simulation run.
      - run: make tools venv PYTHON=python
      - run: make test
